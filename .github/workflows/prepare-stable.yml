# GitHub Actions workflow
# This workflow prepares the stable version before merging develop into main.
# It strips the -beta suffix from the VERSION file and CHANGELOG.md on develop.
#
# Triggered on:
#   - PR from develop to main is opened/updated -> prepare changelog & version file

name: Prepare stable version

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  prepare-stable-version:
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    uses: Carmenda-nl/carmenda-workflows/.github/workflows/python-prepare-stable.yml@main
    with:
      version-file: app/main/VERSION
